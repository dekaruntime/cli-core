[package]
name = "tana-cli-core"
version = "0.1.0"
edition = "2021"
description = "Shared Tana CLI primitives for auth token storage and linkhash identity"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

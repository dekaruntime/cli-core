[package]
name = "deka-cli-core"
version = "0.3.1"
license = "Apache-2.0"
edition = "2021"
description = "Shared core for Deka command-line tools: self-update trust machinery, CLI setup, auth and monitoring plumbing"
repository = "https://github.com/dekaruntime/cli-core"
readme = "README.md"
publish = ["crates-io"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1", features = ["fs"] }
zstd = "0.13"
zstd-safe = "7"

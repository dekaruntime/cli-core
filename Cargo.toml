[package]
name = "deka-cli-core"
version = "0.4.2"
license = "Apache-2.0"
edition = "2021"
description = "Shared core for Deka command-line tools: self-update trust machinery, CLI setup, auth and monitoring plumbing"
repository = "https://github.com/dekaruntime/cli-core"
readme = "README.md"
publish = ["crates-io"]

[features]
default = ["registry", "native"]
registry = []
native = [
    "dep:anyhow", "dep:base64", "dep:chrono", "dep:ed25519-dalek", "dep:fs2",
    "dep:reqwest", "dep:semver", "dep:serde", "dep:serde_json", "dep:sha2",
    "dep:tempfile", "dep:thiserror", "dep:tokio", "dep:zstd", "dep:zstd-safe",
]

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"], optional = true }
ed25519-dalek = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"], optional = true }
semver = { version = "1", features = ["serde"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
thiserror = { version = "1.0", optional = true }
tokio = { version = "1", features = ["fs"], optional = true }
zstd = { version = "0.14", optional = true }
zstd-safe = { version = "7", optional = true }

[[bin]]
name = "harar-anchor-init"
path = "src/bin/harar-anchor-init.rs"
required-features = ["native"]

[[test]]
name = "context_env"
harness = false
required-features = ["registry"]

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    # The ceremony-floor test verifies the public anchor fixture provisioned on
    # the organization runner; it requires no credentials.
    runs-on: [self-hosted, macOS, ARM64]
    environment: public-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked -- --test-threads=1
